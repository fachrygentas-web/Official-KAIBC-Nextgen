<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment | KAIBC Nextgen</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
        }

        /* Navigasi */
        nav { text-align: center; margin-bottom: 50px; }
        nav > a, .dropdown > a { color: #ff0055; margin: 0 15px; text-decoration: none; font-weight: bold; cursor: pointer; }
        
        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { 
            display: none; /* Awalnya sembunyi */
            position: absolute; 
            background-color: #1a1a1a; 
            min-width: 160px; 
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2); 
            z-index: 100; 
            border: 1px solid #ff0055; 
            border-radius: 5px; 
            margin-top: 5px; 
        }
        .dropdown-content a { color: #ffffff; padding: 12px 16px; text-decoration: none; display: block; text-align: left; font-size: 14px; }
        .dropdown-content a:hover { background-color: #ff0055; color: white; }

        /* Class untuk menampilkan menu via JS */
        .show { display: block; }

        /* Container */
        .container { 
            width: 80%; margin: 40px auto; 
            background: rgba(20, 20, 25, 0.8); 
            padding: 30px; border-radius: 15px; 
            border: 1px solid #ff0055; 
        }
        h2 { color: #ff0055; }
        .back-link { color: #ff0055; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <a href="announcement.html">Announcement</a>
        
        <div class="dropdown">
            <!-- Pake onclick buat manggil fungsi JS -->
            <a href="#" onclick="toggleRecruit(event)">Recruitment ▼</a>
            <div id="recruitDropdown" class="dropdown-content">
                <a href="recruit_staff.html">Recruitment Staff</a>
                <a href="recruit_dev.html">Recruitment Developer</a>
            </div>
        </div>

        <a href="TeamKAIBC(owner-staff).html">Team</a>
        <a href="Perjalanan Tentang KAIBC.html">Perjalanan KAIBC</a>
    </nav>

    <div class="container">
        <h2>🚀 Recruitment</h2>
        <p>Kami mencari talenta baru! Silahkan hubungi admin untuk tes masuk.</p>
        
        <a href="#" style="color: #ff0055; text-decoration: none; font-weight: bold;">
            [Klik Di Sini untuk Daftar]
        </a>
        
        <br><br>
        <a href="index.html">Kembali ke Home</a>
    </div>

    <script>
        // Fungsi buat buka/tutup menu
        function toggleRecruit(event) {
            event.preventDefault(); // Mencegah link pindah halaman
            document.getElementById("recruitDropdown").classList.toggle("show");
        }

        // Fungsi biar menu ketutup pas klik di luar area menu
        window.onclick = function(event) {
            if (!event.target.matches('.dropdown > a')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
