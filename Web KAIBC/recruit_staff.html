<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment Staff | KAIBC Nextgen</title>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Navigasi */
        nav { text-align: center; margin-bottom: 50px; }
        nav > a, .dropdown > a { color: #ff0055; margin: 0 15px; text-decoration: none; font-weight: bold; cursor: pointer; }
        
        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #1a1a1a; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 100; border: 1px solid #ff0055; border-radius: 5px; margin-top: 5px; }
        .dropdown-content a { color: #ffffff; padding: 12px 16px; text-decoration: none; display: block; text-align: left; font-size: 14px; }
        .dropdown-content a:hover { background-color: #ff0055; color: white; }
        .show { display: block; }

        /* Content Box */
        .section-box { background-color: #1a1a1a; padding: 30px; margin: 40px auto; border-left: 5px solid #ff0055; border-radius: 5px; width: 80%; }
        h2 { color: #ff0055; }
        .back-link { color: #ff0055; text-decoration: none; font-weight: bold; }
        footer { text-align: center; margin-top: 50px; color: #555; font-size: 0.9em; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="announcement.html">Announcement</a>
        <div class="dropdown">
            <a href="#" onclick="toggleRecruit(event)">Recruitment ▼</a>
            <div id="recruitDropdown" class="dropdown-content">
                <a href="recruit_staff.html">Recruitment Staff</a>
                <a href="recruit_developer.html">Recruitment Developer</a>
            </div>
        </div>
        <a href="TeamKAIBC(owner-staff).html">Team</a>
        <a href="Perjalanan Tentang KAIBC.html">Perjalanan KAIBC</a>
    </nav>

    <div class="section-box">
        <h2>🚀 Recruitment Staff</h2>
        <p>Kami sedang mencari Staff baru! Silahkan hubungi admin untuk tes masuk.</p>
        <a href="#" style="color: #ff0055; font-weight: bold;">[Klik Di Sini untuk Daftar]</a>
        <br><br>
        <a href="index.html" class="back-link">← Kembali ke Home</a>
    </div>

    <footer>&copy; 2026 KAIBC Nextgen Official.</footer>

    <script>
        function toggleRecruit(event) { event.preventDefault(); document.getElementById("recruitDropdown").classList.toggle("show"); }
        window.onclick = function(event) { if (!event.target.matches('.dropdown > a')) { var dropdowns = document.getElementsByClassName("dropdown-content"); for (var i = 0; i < dropdowns.length; i++) { var openDropdown = dropdowns[i]; if (openDropdown.classList.contains('show')) { openDropdown.classList.remove('show'); } } } }
    </script>
</body>
</html>
