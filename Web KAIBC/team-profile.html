<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Profile | KAIBC Nextgen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        .container { 
            width: 90%; margin: 50px auto; 
            padding: 40px; border-radius: 20px;
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid #ff0055;
            opacity: 0; 
            animation: fadeIn 1.5s ease-in forwards; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #ff0055; text-align: center; margin-bottom: 20px; }

        /* Style Video */
        .org-video { 
            width: 100%; max-width: 600px; display: block; margin: 0 auto 30px auto; 
            border-radius: 10px; border: 2px solid #ff0055; 
        }

        .org-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .staff-card {
            background: #1a1a1a; padding: 15px; border-radius: 15px;
            text-align: center; border: 1px solid #333;
            transition: transform 0.3s;
        }
        .staff-card:hover { transform: scale(1.05); border-color: #ff0055; }
        
        .staff-card img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; border: 2px solid #ff0055; }
        .staff-name { font-weight: bold; color: #ff0055; }
        .staff-job { font-size: 12px; color: #aaa; margin-bottom: 10px; }

        .social-links { margin-top: 10px; }
        .social-links a { color: #fff; margin: 0 5px; font-size: 16px; opacity: 0.7; }
        .social-links a:hover { opacity: 1; color: #ff0055; }

        .back-link { display: block; text-align: center; margin-top: 50px; color: #ff0055; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Struktur Staff Manager KAIBC</h1>
        
        <video class="org-video" controls>
            <source src="Diagram Struktur Organisasi Sekolah Ilustratif Doodle Pastel_20260729_222348_0000.mp4" type="video/mp4">
            Browser kamu tidak mendukung pemutaran video.
        </video>
        
        <a href="index.html">Kembali ke Home</a>
    </div>

</body>
</html>
